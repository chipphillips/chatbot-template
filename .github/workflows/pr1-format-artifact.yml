name: PR1 one-time formatting artifact

on:
  push:
    branches:
      - feat/founder-operator-console-foundation

permissions:
  contents: read

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Normalize TypeScript formatting
        run: pnpm exec prettier --write "**/*.{ts,tsx}"
      - name: Validate normalized source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm exec prettier --check "**/*.{ts,tsx}"
      - name: Package normalized source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            -czf "$RUNNER_TEMP/pr1-formatted-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pr1-formatted-source
          path: ${{ runner.temp }}/pr1-formatted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
