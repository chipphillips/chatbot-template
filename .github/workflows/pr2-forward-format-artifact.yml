name: PR2 one-time forward integration

on:
  push:
    branches:
      - feat/operator-approval-knowledge-harness

permissions:
  contents: write

jobs:
  integrate-format-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and integrate PR1 head
        run: |
          git config user.name "MAX integration bot"
          git config user.email "max-integration@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin feat/founder-operator-console-foundation:refs/remotes/origin/foundation
          test "$(git rev-parse refs/remotes/origin/foundation)" = "8ef181ba14923d433b4cb3966e1b3f96555eabc7"
          if ! git merge --no-commit --no-ff refs/remotes/origin/foundation; then
            unresolved="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' components/chat.tsx components/operator-sidebar.tsx | sort)"
            test "$unresolved" = "$expected"
            git checkout --ours components/chat.tsx components/operator-sidebar.tsx
            git add components/chat.tsx components/operator-sidebar.tsx
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - run: pnpm install --frozen-lockfile
      - name: Normalize TypeScript formatting
        run: pnpm exec prettier --write "**/*.{ts,tsx}"
      - name: Remove one-time workflow from final tree
        run: git rm .github/workflows/pr2-forward-format-artifact.yml
      - name: Validate integrated source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm exec prettier --check "**/*.{ts,tsx}"
      - name: Commit and push the validated stack integration
        run: |
          git add -A
          git diff --cached --check
          git commit -m "style: integrate foundation formatting"
          git push origin HEAD:feat/operator-approval-knowledge-harness
